name: Extras (non-blocking)

# Benchmarks and NATS integration are informational. Coverage emits a live
# required context, so the complete workflow runs for pull requests and
# synthetic merge-group commits.

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: extras-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: benchmarks
    runs-on: ubuntu-24.04
    # Raised from 20 to 30: the install-build-deps step (apt-get update + conan
    # install) intermittently exceeds 20 minutes on GitHub-hosted runners during
    # slow-network windows, cancelling the whole extras run and re-posting
    # cancelled statuses for the required `coverage` check (which blocks the PR).
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        uses: ./.github/actions/install-build-deps

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/x86.release/_deps
          # -podman-v2: invalidate pre-migration host-path-stamped subbuild
          # caches. `make compile.release` configures inside the dev container
          # (/workspace/build/...), so restoring a host-stamped _deps cache
          # makes cmake abort with "The current CMakeCache.txt directory ... is
          # different than the directory ... where CMakeCache.txt was created"
          # (#568 migration gap). Matches _required.yml's `build` job key so the
          # warm release _deps cache is shared.
          key: fetchcontent-release-podman-v2-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-release-podman-v2-${{ runner.os }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV

      - name: Install Conan dependencies
        run: make deps

      - name: Build release
        run: make compile.release

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Run benchmarks
        run: make benchmark

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results
          path: build/reports/benchmarks/
          retention-days: 30
          if-no-files-found: ignore

  nats-integration:
    name: NATS integration tests
    runs-on: ubuntu-24.04
    # 20 (was 15): leave headroom for a cold dev-image rebuild — any
    # Containerfile/conanfile.py change misses the exact-match image cache in
    # install-build-deps and rebuilds the image in-job (~7-10 min) before
    # deps/compile even start.
    timeout-minutes: 20

    services:
      nats:
        image: nats:latest
        ports:
          - 4222:4222
        # nats:latest is scratch-based (no shell) — health checked by the wait step below

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        uses: ./.github/actions/install-build-deps

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/x86.release/_deps
          # -podman-v2: see the benchmarks job's cache step above — restoring a
          # pre-migration host-path-stamped _deps cache breaks the in-container
          # cmake configure (#568 migration gap).
          key: fetchcontent-release-podman-v2-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-release-podman-v2-${{ runner.os }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV

      - name: Install Conan dependencies
        run: make deps

      - name: Build release
        run: make compile.release

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Wait for NATS to be ready
        run: |
          for i in {1..30}; do
            if nc -z 127.0.0.1 4222; then
              echo "NATS is ready"
              exit 0
            fi
            echo "Waiting for NATS... ($i/30)"
            sleep 1
          done
          echo "NATS failed to start"
          exit 1

      - name: Run NATS integration tests
        env:
          KEYSTONE_INTEGRATION_TESTS: "1"
          NATS_URL: nats://127.0.0.1:4222
        run: ctest --preset release -R "Nats" --output-on-failure

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        uses: ./.github/actions/install-build-deps
        with:
          include-coverage: "true"

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/x86.debug.coverage/_deps
          key: fetchcontent-coverage-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-coverage-${{ runner.os }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV

      - name: Install Conan dependencies
        run: make deps

      - name: Build with coverage
        run: make compile.debug.coverage

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Run tests for coverage
        run: make test.debug.coverage

      - name: Generate coverage report
        # Must run inside the dev container: the make compile/test.debug.coverage
        # steps above ran cmake/ninja/ctest in-container (via the Makefile's
        # CONTAINER_PREFIX), so the build tree's CMakeCache, CTestTestfile and
        # .gcda paths are all stamped with the in-container /workspace/... root.
        # Running generate_coverage.sh on the host re-runs ctest against those
        # /workspace paths (which do not exist on the host) and finds no .gcda
        # files. Executing in-container keeps lcov/genhtml/ctest consistent with
        # the build+test steps; the report lands in the bind-mounted build/ dir.
        run: |
          chmod +x scripts/generate_coverage.sh
          DOCKER_HOST="${DOCKER_HOST:-}" podman-compose exec -T dev bash -c '
            BUILD_DIR=build/x86.coverage.debug ./scripts/generate_coverage.sh
          '

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: build/coverage/html/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: build/coverage/coverage_filtered.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
