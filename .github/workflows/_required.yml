name: Required Checks

# Canonical required-checks workflow for the homeric-main-baseline ruleset.
# Every job name here is an exact context string in the branch protection ruleset.
# All CI is consolidated here — ci.yml, security-scan.yml, codeql-analysis.yml,
# dependency-audit.yml, and build-and-test.yml are deleted in favour of this file.

on:
  push:
    branches: [main, develop, "claude/**"]

  pull_request:
    branches: [main, develop]

  merge_group:
    types: [checks_requested]

  workflow_dispatch:

concurrency:
  group: required-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # ============================================================
  # 0. forbid-suppressions
  #    Regression guard ported from HomericIntelligence/Odysseus#280.
  #    Blocks `|| true` and `continue-on-error: true` from re-entering
  #    the tree. The corresponding pygrep hooks in .pre-commit-config.yaml
  #    catch these locally before commit; this job is the CI backstop.
  # ============================================================

  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: "Reject silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            -- \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.hcl' \
            'Dockerfile*' '**/Dockerfile*' \
            'justfile' '**/justfile' 'Justfile' '**/Justfile')
          declare -a scan_files=()
          for f in "${files[@]}"; do
            case "$f" in
              # Exempt this workflow file (heredoc would otherwise self-match)
              .github/workflows/_required.yml) continue ;;
              # Exempt any runbook that documents the rule (if present)
              docs/runbooks/no-silent-failures.md) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nE '\|\|[[:space:]]*true([[:space:]]*$|[[:space:]]+#)' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found silent-failure workarounds above. Refactor per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no silent-failure workarounds found'

      - name: "Reject continue-on-error workflow opt-out"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow files"
            exit 0
          fi
          if grep -nE '^[[:space:]]*continue-on-error:[[:space:]]*true[[:space:]]*$' "${files[@]}"; then
            echo ""
            echo '::error::Found "continue-on-error: true" above.'
            echo '::error::Fix the root cause per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no "continue-on-error: true" found'

      - name: "Reject advisory annotation pattern"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          # The advisory-annotation pattern in workflow run blocks is morally
          # equivalent to continue-on-error: true: it lets a tool fail without
          # failing the CI step. The runbook (Bucket F) requires every tool
          # to be fail-fast. The only legitimate annotation is informational
          # text not tied to a tool's exit code — those should use
          # echo "WARN:" to stdout instead. See docs/runbooks/no-silent-failures.md.
          declare -a scan_files=()
          for f in "${files[@]}"; do
            # Exempt this workflow file (heredoc would otherwise self-match).
            case "$f" in
              .github/workflows/_required.yml) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nF '::warning::' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found advisory annotations above. Make the underlying tool fail-fast or use echo "WARN:" to stdout. See docs/runbooks/no-silent-failures.md Bucket F.'
            exit 1
          fi
          echo 'OK: no advisory annotations found'

  # ============================================================
  # 1. lint
  #    clang-format, pre-commit, CMake cycle check,
  #    cppcheck, clang-tidy, mypy (conanfile.py)
  # ============================================================

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-keystone-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-keystone-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t keystone-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-lint`.
      - name: lint (in container)
        run: bash scripts/run_ci_local.sh lint

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-keystone-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-keystone-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t keystone-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-markdownlint`.
      - name: markdownlint (in container)
        run: bash scripts/run_ci_local.sh markdownlint

  uv-check:
    name: uv-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-keystone-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-keystone-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t keystone-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-uv-check`.
      - name: uv-check (in container)
        run: bash scripts/run_ci_local.sh uv-check

  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-keystone-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-keystone-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t keystone-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-justfile-check`.
      - name: justfile-check (in container)
        run: bash scripts/run_ci_local.sh justfile-check

  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-keystone-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-keystone-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t keystone-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-symlink-check`.
      - name: symlink-check (in container)
        run: bash scripts/run_ci_local.sh symlink-check

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-keystone-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-keystone-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t keystone-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-unit-tests`.
      - name: unit-tests (in container)
        run: bash scripts/run_ci_local.sh unit-tests

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-keystone-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-keystone-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t keystone-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-integration-tests`.
      - name: integration-tests (in container)
        run: bash scripts/run_ci_local.sh integration-tests

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [unit-tests, integration-tests]
    steps:
      - name: Aggregate test result
        run: echo "unit-tests + integration-tests passed; canonical 'test' category satisfied"

  # ============================================================
  # 4. build
  # ============================================================

  build:
    name: build
    runs-on: ubuntu-24.04
    # 20 -> 30: install-build-deps + conan install intermittently exceed 20 min
    # on GitHub-hosted runners during cold-cache/slow-network windows, cancelling
    # the job and cascading cancelled statuses to dependent jobs (see #656).
    timeout-minutes: 30
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        uses: ./.github/actions/install-build-deps

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/x86.release/_deps
          # -podman-v2: invalidate pre-migration host-path-stamped subbuild
          # caches; in-container builds use /workspace/build/... (see clang-tidy
          # cache step in the lint job for the full rationale).
          key: fetchcontent-release-podman-v2-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-release-podman-v2-${{ runner.os }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV

      - name: Install Conan dependencies
        run: make deps

      - name: Build release
        run: make compile.release

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  # ============================================================
  # 4b. install  (canonical)
  #    Installs the release tree into a clean staging prefix,
  #    verifies the declared install layout (libs, headers, CMake
  #    package config), and compiles a find_package(Keystone)
  #    consumer against the staged prefix. Keystone is a pure
  #    C++20 library (ADR-015/016), so this validates library
  #    consumability rather than running a binary. See #596.
  # ============================================================

  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        uses: ./.github/actions/install-build-deps

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/x86.release/_deps
          # -podman-v2: invalidate pre-migration host-path-stamped subbuild
          # caches; in-container builds use /workspace/build/... (see clang-tidy
          # cache step in the lint job for the full rationale).
          key: fetchcontent-release-podman-v2-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-release-podman-v2-${{ runner.os }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV

      - name: Install Conan dependencies
        run: make deps

      - name: Build release
        run: make compile.release

      - name: Install to staging prefix + consumer smoke test
        # Must run inside the dev container: cmake_install.cmake embeds
        # /workspace-absolute paths (repo is bind-mounted at /workspace).
        run: |
          DOCKER_HOST="${DOCKER_HOST:-}" podman-compose exec -T dev ./scripts/check-install.sh

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload staging prefix on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: install-staging
          path: build/install-staging/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================
  # 4a. package  (canonical)
  #    Builds the release tree and produces the CPack artifacts
  #    (DEB / RPM / TGZ / ZIP) on every push/PR, validating that
  #    the packaging path stays green between releases. The
  #    release-time `Publish Release Artifacts` job uploads these
  #    same packages to a GitHub Release; this job only verifies
  #    they build, emitting the canonical `package` check-run.
  # ============================================================

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        uses: ./.github/actions/install-build-deps

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/x86.release/_deps
          # -podman-v2: invalidate pre-migration host-path-stamped subbuild
          # caches; in-container builds use /workspace/build/... (see clang-tidy
          # cache step above for the full rationale). Matches the `build` job's
          # key so both jobs share the same warm release _deps cache.
          key: fetchcontent-release-podman-v2-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-release-podman-v2-${{ runner.os }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV

      - name: Install Conan dependencies
        # The %.native Makefile targets were removed by the Podman migration
        # (#501/#568); this job was left on the deleted deps.native /
        # compile.release.native paths, failing with "No rule to make target".
        run: make deps

      - name: Build release
        run: make compile.release

      - name: Build CPack packages (DEB, RPM, TGZ, ZIP)
        # Must run inside the dev container: the release tree was configured
        # in-container, so CPackConfig.cmake and the CMake cache reference the
        # in-container /workspace/build/x86.release root. The dev image ships
        # rpmbuild (Containerfile development stage) for the RPM generator; the
        # produced packages land in the bind-mounted build/ dir for the host
        # steps below.
        run: |
          DOCKER_HOST="${DOCKER_HOST:-}" podman-compose exec -T dev bash -c '
            set -euo pipefail
            cd build/x86.release
            cpack -G DEB
            cpack -G RPM
            cpack -G TGZ
            cpack -G ZIP
          '

      - name: List produced packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(build/x86.release/*.deb build/x86.release/*.rpm \
                build/x86.release/*.tar.gz build/x86.release/*.zip)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::CPack produced no package artifacts"
            exit 1
          fi
          printf '%s\n' "${pkgs[@]}"

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cpack-packages
          path: |
            build/x86.release/*.deb
            build/x86.release/*.rpm
            build/x86.release/*.tar.gz
            build/x86.release/*.zip
          retention-days: 30
          if-no-files-found: ignore

  # ============================================================
  # 5. schema-validation
  # ============================================================

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-keystone-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-keystone-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t keystone-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-schema-validation`.
      - name: schema-validation (in container)
        run: bash scripts/run_ci_local.sh schema-validation

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-keystone-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-keystone-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t keystone-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-deps-version-sync`.
      - name: deps-version-sync (in container)
        run: bash scripts/run_ci_local.sh deps-version-sync

  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate release-please config and manifest
        run: |
          python3 - <<'PYEOF'
          import json, re, pathlib, sys

          root = pathlib.Path(".")
          failures = []

          # 1. Both files must parse as JSON.
          config = json.loads((root / "release-please-config.json").read_text())
          manifest = json.loads((root / ".release-please-manifest.json").read_text())
          print("release-please-config.json  : parses")
          print(".release-please-manifest.json: parses")

          # 2. Manifest must carry a semver version for the root package.
          version = manifest.get(".")
          if not version or not re.fullmatch(r"\d+\.\d+\.\d+", version):
              failures.append(f"manifest '.' entry is not X.Y.Z semver: {version!r}")
          else:
              print(f"manifest version             : {version}")

          # 3. Every extra-files search regex must still match its target
          #    file. If a refactor renames the version line, release-please
          #    silently stops bumping that file — catch the drift here.
          for extra in config.get("extra-files", []):
              path = extra.get("path", "")
              target = root / path
              if not target.is_file():
                  failures.append(f"extra-files target missing: {path}")
                  continue
              text = target.read_text()
              for rule in extra.get("data", []):
                  pattern = rule.get("search", "")
                  if not re.search(pattern, text, re.MULTILINE):
                      failures.append(
                          f"extra-files regex no longer matches {path}: {pattern!r}"
                      )
                  else:
                      print(f"extra-files regex matches    : {path} ~ {pattern!r}")

          if failures:
              print("\nrelease-please validation FAILED:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          print("\nrelease-please config and manifest are release-ready")
          PYEOF

      - name: Verify version consistency across release surfaces
        run: |
          python3 - <<'PYEOF'
          import json, re, pathlib, sys

          root = pathlib.Path(".")

          manifest_ver = json.loads(
              (root / ".release-please-manifest.json").read_text()
          ).get(".")

          cmake_text = (root / "CMakeLists.txt").read_text()
          cmake_m = re.search(r"project\s*\([^)]*VERSION\s+([\d.]+)", cmake_text, re.DOTALL)
          cmake_ver = cmake_m.group(1) if cmake_m else None

          conan_m = re.search(
              r'version\s*=\s*["\']([^"\']+)["\']',
              (root / "conanfile.py").read_text(),
          )
          conan_ver = conan_m.group(1) if conan_m else None

          # pixi.toml was removed (Odysseus ADR-018: uv replaces pixi/conda for
          # the build toolchain). Release surfaces are the version sources of
          # truth only: manifest, CMakeLists.txt, conanfile.py.
          versions = {
              ".release-please-manifest.json": manifest_ver,
              "CMakeLists.txt":                cmake_ver,
              "conanfile.py":                  conan_ver,
          }
          for k, v in versions.items():
              print(f"{k:32s}: {v}")

          missing = [k for k, v in versions.items() if v is None]
          if missing:
              print(f"\nVersion not found in: {', '.join(missing)}")
              sys.exit(1)
          if len(set(versions.values())) != 1:
              print("\nRelease surfaces disagree on version")
              sys.exit(1)
          print(f"\nAll release surfaces agree: {manifest_ver}")
          PYEOF

      - name: Verify CHANGELOG preconditions
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys

          text = pathlib.Path("CHANGELOG.md").read_text()
          failures = []
          if not text.strip():
              failures.append("CHANGELOG.md is empty")
          if not text.lstrip().startswith("# Changelog"):
              failures.append("CHANGELOG.md must start with '# Changelog' heading")
          if "## " not in text:
              failures.append("CHANGELOG.md has no '## ' release/Unreleased section")
          if failures:
              for f in failures:
                  print(f"FAIL: {f}")
              sys.exit(1)
          print("CHANGELOG.md present with heading and at least one section")
          PYEOF

      - name: Dry-validate CPack packaging metadata
        # Static validation of the CPack setup the tagged publish-release
        # job depends on — no configure/compile, so it stays fast. Checks
        # that CPack is actually included, the package identity fields are
        # set, and every resource file CPack will embed exists in the tree.
        run: |
          python3 - <<'PYEOF'
          import pathlib, re, sys

          root = pathlib.Path(".")
          text = (root / "CMakeLists.txt").read_text()
          failures = []

          if not re.search(r"^\s*include\s*\(\s*CPack\s*\)", text, re.MULTILINE):
              failures.append("CMakeLists.txt never include(CPack)s")

          for var in (
              "CPACK_PACKAGE_NAME",
              "CPACK_PACKAGE_VERSION",
              "CPACK_PACKAGE_CONTACT",
          ):
              if not re.search(rf"set\s*\(\s*{var}\b", text):
                  failures.append(f"{var} is not set")

          # Resource files CPack embeds into DEB/RPM/archive metadata.
          for var in ("CPACK_RESOURCE_FILE_LICENSE", "CPACK_RESOURCE_FILE_README"):
              m = re.search(
                  rf'set\s*\(\s*{var}\s+"?\$\{{PROJECT_SOURCE_DIR\}}/([^")\s]+)', text
              )
              if not m:
                  failures.append(f"{var} is not set to a PROJECT_SOURCE_DIR path")
              elif not (root / m.group(1)).is_file():
                  failures.append(f"{var} points at missing file: {m.group(1)}")
              else:
                  print(f"{var:28s}: {m.group(1)} exists")

          if failures:
              print("\nCPack dry-validation FAILED:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          print("\nCPack packaging metadata is release-ready")
          PYEOF

  # ============================================================
  # 8. security/dependency-scan
  #    pip-audit + Trivy FS + supply-chain dependency-review
  #    + Docker image scan (Trivy container)
  # ============================================================

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # trivy SARIF upload needs code-scanning write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-keystone-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-keystone-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t keystone-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-security-dependency-scan`.
      - name: security-dependency-scan (in container)
        run: bash scripts/run_ci_local.sh security-dependency-scan

      # Container image scan (Trivy). Builds the production stage and scans
      # the OS layer for package CVEs, uploading SARIF so findings surface in
      # the Security tab (category trivy-container). This is the scan that
      # produced the historical library/projectkeystone OsPackageVulnerability
      # alerts; the base digest pin + apt-get upgrade in Containerfile keep
      # the OS layer patched, and this step keeps the alerts fresh. The SARIF
      # upload carries ALL severities so MEDIUM/LOW findings stay honestly
      # reported (auto-closing only once actually fixed), while the summary
      # gate fails fast on CRITICAL/HIGH per Bucket F (no continue-on-error).
      - name: Build production image for scan (podman)
        run: podman build --target production -t keystone:scan .

      - name: Save scan image to OCI tar
        run: podman save -o container-scan.tar keystone:scan

      - name: Run Trivy container scan (SARIF, all severities)
        run: |
          podman run --rm \
            -v "$PWD:/workspace:Z" -w /workspace \
            aquasec/trivy:0.58.1 image \
              --severity CRITICAL,HIGH,MEDIUM,LOW \
              --no-progress \
              --format sarif \
              --output container-scan.sarif \
              --scanners vuln \
              --input container-scan.tar

      - name: Run Trivy container scan (JSON summary)
        run: |
          podman run --rm \
            -v "$PWD:/workspace:Z" -w /workspace \
            aquasec/trivy:0.58.1 image \
              --severity CRITICAL,HIGH,MEDIUM,LOW \
              --no-progress \
              --format json \
              --output container-scan.json \
              --scanners vuln \
              --input container-scan.tar

      - name: Container scan summary
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, pathlib

          p = pathlib.Path("container-scan.json")
          if not p.is_file():
              print("container-scan.json missing — scan did not run")
              raise SystemExit(0)
          data = json.loads(p.read_text())
          counts = {}
          for res in data.get("Results", []):
              for v in res.get("Vulnerabilities", []):
                  sev = v.get("Severity", "UNKNOWN")
                  counts[sev] = counts.get(sev, 0) + 1
          print("## Container scan")
          print("| Severity | Count |")
          print("|----------|-------|")
          for sev in ("CRITICAL", "HIGH", "MEDIUM", "LOW"):
              print(f"| {sev} | {counts.get(sev, 0)} |")
          if counts.get("CRITICAL", 0) or counts.get("HIGH", 0):
              print("::error::Critical/high vulnerabilities in container image")
              raise SystemExit(1)
          PYEOF

      - name: Upload Trivy container SARIF to Security tab
        if: always() && hashFiles('container-scan.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v3
        with:
          sarif_file: container-scan.sarif
          category: trivy-container

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-keystone-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-keystone-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t keystone-ci:local .
      - name: Run Gitleaks
        run: |
          if [ -f .gitleaks.toml ]; then
            podman run --rm --userns=keep-id:uid=1000,gid=1000 \
              -v "$PWD:/workspace:Z" -w /workspace keystone-ci:local \
              gitleaks detect --source /workspace --config .gitleaks.toml \
                --report-format sarif --report-path gitleaks.sarif --redact
          else
            podman run --rm --userns=keep-id:uid=1000,gid=1000 \
              -v "$PWD:/workspace:Z" -w /workspace keystone-ci:local \
              gitleaks detect --source /workspace \
                --report-format sarif --report-path gitleaks.sarif --redact
          fi

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v3
        with:
          sarif_file: gitleaks.sarif

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        uses: ./.github/actions/install-build-deps
        with:
          include-coverage: "true"

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/x86.debug.coverage/_deps
          # -podman-v2: invalidate pre-migration host-path-stamped subbuild
          # caches; in-container builds use /workspace/build/... (see clang-tidy
          # cache step in the lint job for the full rationale).
          key: fetchcontent-coverage-podman-v2-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-coverage-podman-v2-${{ runner.os }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV

      - name: Install Conan dependencies
        run: make deps

      - name: Build with coverage
        run: make compile.debug.coverage

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Run tests for coverage
        run: make test.debug.coverage

      - name: Generate coverage report
        # Must run inside the dev container for the same reason as the lint
        # job's configure/build steps (and the make compile/test.debug.coverage
        # steps above, which already exec in-container via the Makefile's
        # CONTAINER_PREFIX): generate_coverage.sh reconfigures CMake against
        # build/conan-deps/conan_toolchain.cmake and reads ~/.conan2, both of
        # which were produced *inside* the container by `make deps`. Running it
        # on the host configures against a host-path CMakeCache and a host
        # ~/.conan2 that does not match the in-container Conan layout (gmock_main
        # "not found in package"). Executing in-container keeps every CMakeCache
        # absolute path under /workspace/build/... consistent with lint and the
        # make compile/test steps. lcov, genhtml, bc and llvm-cov-18 are all
        # present in the dev image (Containerfile builder + development stages).
        # The report files land under the bind-mounted build/ dir, so the host
        # upload-artifact / codecov steps below still read them.
        run: |
          chmod +x scripts/generate_coverage.sh
          DOCKER_HOST="${DOCKER_HOST:-}" podman-compose exec -T dev bash -c '
            BUILD_DIR=build/x86.coverage.debug ./scripts/generate_coverage.sh
          '

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: build/coverage/html/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: build/coverage/coverage_filtered.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================
  # 22. analyze  (restored CodeQL, see commit 79e8e0e)
  #    The consolidation deleted codeql-analysis.yml but never added the
  #    Analyze job to this file, so C++ had no CodeQL coverage and the
  #    cpp/unused-* alerts from the old workflow could never auto-close.
  #    Restored from the deleted workflow (c-cpp manual build + python).
  # ============================================================
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # C++ manual build steps -- only run for c-cpp
      - name: Install build dependencies
        if: matrix.language == 'c-cpp'
        uses: ./.github/actions/install-build-deps
        with:
          cache-conan: "true"

      - name: Cache FetchContent downloads
        if: matrix.language == 'c-cpp'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/codeql/_deps
          key: fetchcontent-codeql-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-codeql-${{ runner.os }}-

      - name: Install Conan dependencies
        if: matrix.language == 'c-cpp'
        run: conan install . --output-folder=build/codeql/conan-deps --build=missing -s build_type=Release -s compiler.cppstd=20

      - name: Build for CodeQL analysis
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S . -B build/codeql -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=build/codeql/conan-deps/conan_toolchain.cmake
          cmake --build build/codeql

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v3
        with:
          category: "/language:${{ matrix.language }}"
